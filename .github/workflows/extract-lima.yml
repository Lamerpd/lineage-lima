name: Extract Lima Kernel Sources

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone kernel repository
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git kernel-mtk

      - name: Checkout Lima tag
        working-directory: kernel-mtk
        run: |
          git fetch --depth=1 origin \
            refs/tags/MMI-PMD29.70-81-lima:refs/tags/MMI-PMD29.70-81-lima
          git checkout MMI-PMD29.70-81-lima

      - name: Extract real Lima files
        working-directory: kernel-mtk
        run: |
          rm -rf ../lima-source
          mkdir -p ../lima-source

          echo "=== BASE FILES ==="

          for file in \
            arch/arm/boot/dts/mt6771.dts \
            arch/arm/configs/ext_config/lima.config
          do
            if git cat-file -e "HEAD:$file" 2>/dev/null; then
              mkdir -p "../lima-source/$(dirname "$file")"
              git show "HEAD:$file" > "../lima-source/$file"
              echo "EXTRACTED: $file"
            else
              echo "MISSING: $file"
            fi
          done

          echo
          echo "=== LIMA SYMLINKS ==="

          git ls-tree -r HEAD --name-only |
            grep -Ei 'mt6771.*lima|lima.*mt6771' |
            while read -r link; do

              echo
              echo ">>> $link"

              mode=$(git ls-tree HEAD "$link" | awk '{print $1}')
              echo "mode: $mode"

              if [ "$mode" != "120000" ]; then
                echo "NOT A SYMLINK"
                continue
              fi

              target=$(git show "HEAD:$link")
              echo "target: $target"

              real=$(realpath -m "$(dirname "$link")/$target")
              echo "resolved: $real"

              if git cat-file -e "HEAD:$real" 2>/dev/null; then
                echo "BLOB FOUND"

                mkdir -p "../lima-source/$(dirname "$real")"

                git show "HEAD:$real" > "../lima-source/$real"

                echo "EXTRACTED: $real"
              else
                echo "!!! TARGET BLOB NOT FOUND: $real !!!"
              fi

            done

          echo
          echo "=== ALL LIMA FILES IN TREE ==="

          git ls-tree -r HEAD --name-only |
            grep -Ei 'mt6771.*lima|lima.*mt6771' || true

          echo
          echo "=== EXTRACTED FILES ==="

          find ../lima-source -type f \
            -printf '%p (%s bytes)\n' |
            sort

      - name: Package Lima sources
        run: |
          rm -f lima-source.tar.gz

          tar -czf lima-source.tar.gz lima-source

          echo "=== TAR CONTENTS ==="
          tar -tzf lima-source.tar.gz |
            grep -Ei 'mt6771|lima|arm64' || true

          echo
          echo "=== TAR SIZE ==="
          ls -lh lima-source.tar.gz

      - name: Upload Lima source
        uses: actions/upload-artifact@v4
        with:
          name: lima-source
          path: lima-source.tar.gz
          retention-days: 7
