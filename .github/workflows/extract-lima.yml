name: Extract Lima Kernel Sources

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone kernel repository
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git kernel-mtk

      - name: Checkout Lima tag
        working-directory: kernel-mtk
        run: |
          git fetch --depth=1 origin \
            refs/tags/MMI-PMD29.70-81-lima:refs/tags/MMI-PMD29.70-81-lima
          git checkout MMI-PMD29.70-81-lima

      - name: Extract Lima files
        working-directory: kernel-mtk
        run: |
          set -e

          rm -rf ../lima-source
          mkdir -p ../lima-source

          echo "=== COPYING BASE FILES ==="

          git show HEAD:arch/arm/boot/dts/mt6771.dts \
            > ../lima-source/arch/arm/boot/dts/mt6771.dts

          mkdir -p ../lima-source/arch/arm/configs/ext_config

          git show HEAD:arch/arm/configs/ext_config/lima.config \
            > ../lima-source/arch/arm/configs/ext_config/lima.config

          echo "=== COPYING ARM64 LIMA FILES ==="

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "COPY: $file"

            mkdir -p "../lima-source/$(dirname "$file")"

            git show "HEAD:$file" > "../lima-source/$file"

          done < <(
            git ls-tree -r HEAD --name-only |
              grep -E '^arch/arm64/boot/dts/mediatek/.*mt6771.*lima|^arch/arm64/boot/dts/mediatek/.*lima.*mt6771'
          )

          echo "=== COPYING ARM64 CAMERA/AUDIO FILES ==="

          for file in \
            arch/arm64/boot/dts/mediatek/mt6771-camera-sensor-moto-lima.dtsi \
            arch/arm64/boot/dts/mediatek/mt6771-moto-audio-lima.dtsi \
            arch/arm64/boot/dts/mediatek/mt6771-moto-main-lima.dtsi \
            arch/arm64/boot/dts/mediatek/mt6771-moto-overlay-lima.dtsi \
            arch/arm64/boot/dts/mediatek/mt6771-moto-overlay-lima-dvt1a.dts \
            arch/arm64/boot/dts/mediatek/mt6771-moto-overlay-lima-dvt1b.dts \
            arch/arm64/boot/dts/mediatek/mt6771-moto-overlay-lima-dvt2.dts \
            arch/arm64/boot/dts/mediatek/mt6771-moto-overlay-lima-evb.dts \
            arch/arm64/boot/dts/mediatek/mt6771-moto-overlay-lima-evt1.dts \
            arch/arm64/boot/dts/mediatek/mt6771-moto-overlay-lima-evt2.dts
          do
            if git cat-file -e "HEAD:$file" 2>/dev/null; then
              echo "COPY: $file"
              mkdir -p "../lima-source/$(dirname "$file")"
              git show "HEAD:$file" > "../lima-source/$file"
            else
              echo "MISSING: $file"
            fi
          done

          echo
          echo "=== EXTRACTED FILES ==="
          find ../lima-source -type f -printf '%p (%s bytes)\n' | sort

          echo
          echo "=== VERIFYING MAIN LIMA FILE ==="

          test -s ../lima-source/arch/arm64/boot/dts/mediatek/mt6771-moto-main-lima.dtsi

          echo "MAIN LIMA DTSI FOUND!"

      - name: Package Lima sources
        working-directory: kernel-mtk
        run: |
          set -e

          tar -czf lima-source.tar.gz ../lima-source

          echo "=== VERIFYING TAR ==="

          tar -tzf lima-source.tar.gz |
            grep -E 'arch/arm64/boot/dts/mediatek/.*mt6771.*lima|arch/arm64/boot/dts/mediatek/.*lima.*mt6771'

          echo
          echo "=== MAIN FILE IN TAR ==="

          tar -tzf lima-source.tar.gz |
            grep 'mt6771-moto-main-lima.dtsi'

          echo
          echo "=== TAR CONTENTS ==="

          tar -tzf lima-source.tar.gz | grep -Ei 'mt6771|lima|arm64'

      - name: Upload Lima source
        uses: actions/upload-artifact@v4
        with:
          name: lima-source
          path: kernel-mtk/lima-source.tar.gz
          if-no-files-found: error
