name: Extract Lima Kernel Sources

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone kernel repository
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git kernel-mtk

      - name: Checkout Lima tag
        working-directory: kernel-mtk
        run: |
          git fetch --depth=1 origin \
            refs/tags/MMI-PMD29.70-81-lima:refs/tags/MMI-PMD29.70-81-lima

          git checkout MMI-PMD29.70-81-lima

      - name: Extract Lima files
        working-directory: kernel-mtk
        run: |
          set -e

          rm -rf ../lima-source
          mkdir -p ../lima-source

          copy_file() {
            file="$1"

            if git cat-file -e "HEAD:$file" 2>/dev/null; then
              echo "COPY: $file"
              mkdir -p "../lima-source/$(dirname "$file")"
              git show "HEAD:$file" > "../lima-source/$file"
            else
              echo "MISSING: $file"
            fi
          }

          echo "=== SEARCHING ALL LIMA FILES ==="

          git ls-tree -r HEAD --name-only |
            grep -Ei '(^|/)(mt6771.*lima|lima.*mt6771)|mt6771.*lima' |
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              copy_file "$file"
            done

          echo
          echo "=== BASE FILES ==="

          copy_file "arch/arm/boot/dts/mt6771.dts"
          copy_file "arch/arm/configs/ext_config/lima.config"

          echo
          echo "=== ALL MT6771 FILES IN REPOSITORY ==="

          git ls-tree -r HEAD --name-only |
            grep -Ei 'mt6771|lima' |
            sort

          echo
          echo "=== EXTRACTED FILES ==="

          find ../lima-source \
            -type f \
            -printf '%p (%s bytes)\n' |
            sort

          echo
          echo "=== VERIFYING LIMA FILES ==="

          COUNT=$(find ../lima-source -type f | wc -l)

          echo "Extracted files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Nothing was extracted!"
            exit 1
          fi

          echo
          echo "=== VERIFYING MAIN LIMA FILE ==="

          MAIN=$(find ../lima-source \
            -type f \
            -iname '*mt6771*moto*main*lima*' |
            head -1 || true)

          if [ -n "$MAIN" ] && [ -s "$MAIN" ]; then
            echo "MAIN LIMA DTSI FOUND:"
            echo "$MAIN"
          else
            echo "WARNING: MAIN LIMA DTSI NOT FOUND"
            echo "This is a warning only."
          fi

      - name: Package Lima sources
        working-directory: kernel-mtk
        run: |
          tar -czf ../lima-source.tar.gz lima-source

          echo "=== TAR CONTENTS ==="

          tar -tzf ../lima-source.tar.gz |
            grep -Ei 'arm64|arm/|mt6771|lima' |
            head -200 || true

      - name: Upload Lima source
        uses: actions/upload-artifact@v4
        with:
          name: lima-kernel-sources
          path: lima-source.tar.gz
          if-no-files-found: error
