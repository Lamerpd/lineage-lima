name: Extract Lima Kernel Sources

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone kernel repository
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git kernel-mtk

      - name: Checkout Lima tag
        working-directory: kernel-mtk
        run: |
          git fetch --depth=1 origin \
            refs/tags/MMI-PMD29.70-81-lima:refs/tags/MMI-PMD29.70-81-lima
          git checkout MMI-PMD29.70-81-lima

      - name: Extract real Lima files
        working-directory: kernel-mtk
        run: |
          set -e

          mkdir -p ../lima-source/arch/arm/boot/dts
          mkdir -p ../lima-source/arch/arm64/boot/dts/mediatek
          mkdir -p ../lima-source/arch/arm/configs/ext_config

          echo "=== BASE FILES ==="

          git show HEAD:arch/arm/boot/dts/mt6771.dts \
            > ../lima-source/arch/arm/boot/dts/mt6771.dts

          git show HEAD:arch/arm/configs/ext_config/lima.config \
            > ../lima-source/arch/arm/configs/ext_config/lima.config

          echo "=== LIMA SYMLINKS ==="

          for file in \
            mt6771-moto-main-lima.dtsi \
            mt6771-moto-overlay-lima.dtsi \
            mt6771-moto-overlay-lima-dvt1a.dts \
            mt6771-moto-overlay-lima-dvt1b.dts \
            mt6771-moto-overlay-lima-dvt2.dts \
            mt6771-moto-overlay-lima-evb.dts \
            mt6771-moto-overlay-lima-evt1.dts \
            mt6771-moto-overlay-lima-evt2.dts
          do
            link="arch/arm/boot/dts/$file"

            echo
            echo ">>> $link"

            target=$(git ls-tree HEAD "$link" | sed 's/.* -> //')

            if [ -z "$target" ]; then
              echo "NOT A SYMLINK OR NOT FOUND"
              continue
            fi

            echo "target: $target"

            real=$(realpath -m "$(dirname "$link")/$target")

            echo "resolved: $real"

            if git cat-file -e "HEAD:$real" 2>/dev/null; then
              echo "BLOB FOUND"

              mkdir -p "../lima-source/$(dirname "$real")"

              git show "HEAD:$real" \
                > "../lima-source/$real"

              echo "EXTRACTED: $real"
            else
              echo "!!! TARGET BLOB NOT FOUND: $real !!!"
            fi
          done

          echo
          echo "=== SEARCHING ADDITIONAL LIMA FILES ==="

          git ls-tree -r HEAD --name-only \
            | grep -Ei 'mt6771.*lima|lima.*mt6771' \
            | while read -r path; do
                echo "$path"
              done

          echo
          echo "=== EXTRACTED FILES ==="
          find ../lima-source -type f -printf '%p (%s bytes)\n' | sort

      - name: Package Lima sources
        run: |
          tar -czf lima-source.tar.gz lima-source

          echo "=== TAR CONTENTS ==="
          tar -tzf lima-source.tar.gz | grep -Ei 'mt6771|lima|arm64' || true

      - name: Upload Lima source
        uses: actions/upload-artifact@v4
        with:
          name: lima-kernel-sources
          path: lima-source.tar.gz
