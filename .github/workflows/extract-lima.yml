name: Extract Lima Kernel Sources

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone kernel repository
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git kernel-mtk

      - name: Checkout Lima tag
        working-directory: kernel-mtk
        run: |
          git fetch --depth=1 origin \
            refs/tags/MMI-PMD29.70-81-lima:refs/tags/MMI-PMD29.70-81-lima
          git checkout MMI-PMD29.70-81-lima

      - name: Inspect Lima tree
        working-directory: kernel-mtk
        run: |
          echo "=== LIMA / MT6771 FILES ==="
          git ls-tree -r --name-only HEAD | grep -Ei 'lima|mt6771' | sort

          echo "=== LIMA DTS INCLUDES ==="
          git grep -nE '#include.*(lima|mt6771|cust|bat_setting)' HEAD -- \
            'arch/arm/boot/dts/*' \
            'arch/arm64/boot/dts/*' 2>/dev/null || true

      - name: Extract Lima files
        working-directory: kernel-mtk
        run: |
          mkdir -p ../lima-source

          git archive HEAD \
            arch/arm/boot/dts \
            arch/arm/configs/ext_config \
            | tar -x -C ../lima-source

          echo "=== EXTRACTED FILES ==="
          find ../lima-source -type f | sort

      - name: Package extracted sources
        run: |
          tar -czf lima-source.tar.gz lima-source

      - name: Upload Lima source
        uses: actions/upload-artifact@v4
        with:
          name: lima-kernel-sources
          path: lima-source.tar.gz
